seed: 42
rdt_repo: /home/ubuntu/RoboticsDiffusionTransformer
pretrained_model: null
output_dir: outputs/part3_smoke

model:
  action_dim: 7
  state_dim: 7
  pred_horizon: 64
  qwen_hidden_size: 2560
  qwen_kv_dim: 2048
  lang_token_dim: 4096
  img_token_dim: 1152
  max_lang_tokens: 128
  image_tokens: 4374
  hidden_size: 128
  depth: 2
  num_heads: 4
  dtype: bfloat16
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  copy_pretrained_final_fc1: false
  gradient_checkpointing: false
  finetune_mode: full
  qwen_fusion: self_attention_kv
  pretrained_copy_mode: compatible
  rdt_state_dim: 128
  state_encoder_layout: rdt_eef
  freeze_state_adaptor: true
  freeze_condition_adaptors: false
  allow_random_frozen_state_adaptor: true

lora:
  rank: 4
  alpha: 8
  dropout: 0.0
  target_self_attention: true
  target_cross_attention: true
  target_ffn: true
  train_final_layer: true

noise_scheduler:
  num_train_timesteps: 100
  num_inference_timesteps: 2
  beta_schedule: squaredcos_cap_v2
  prediction_type: sample
  clip_sample: false

data:
  train_manifest: cache_features/part_3/train/manifest.jsonl
  val_manifest: cache_features/part_3/validation/manifest.jsonl
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  episode_aware_shuffle: true
  shuffle_validation: false
  stratified_validation: true
  excluded_dataset_ids: [bridge]

training:
  max_steps: 2
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: 1
  learning_rate: 1.0e-4
  learning_rate_lora: 1.0e-4
  learning_rate_interfaces: 1.0e-4
  weight_decay_interfaces: 0.0
  warmup_steps: 0
  max_grad_norm: 1.0
  log_every: 1
  validate_every: 2
  save_every: 2
  validation_batches: 1
  validation_samples: 1
  sample_validation_batches: 0
  validation_seed: 12345
  mixed_precision: bf16
  report_to: wandb
  wandb_project: thinkflow-rdt-smoke
  wandb_run_name: part3-smoke
