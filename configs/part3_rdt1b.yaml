seed: 42
rdt_repo: /home/ubuntu/RoboticsDiffusionTransformer
pretrained_model: robotics-diffusion-transformer/rdt-1b
output_dir: outputs/part3_rdt1b_kv

model:
  # Raw cache/action space.
  action_dim: 7
  state_dim: 7
  pred_horizon: 64
  qwen_hidden_size: 2560
  qwen_kv_dim: 2048
  lang_token_dim: 4096
  img_token_dim: 1152
  max_lang_tokens: 128
  image_tokens: 4374  # 2 history frames x 3 cameras x 729 SigLIP patches
  hidden_size: 2048
  depth: 28
  num_heads: 32
  dtype: bfloat16
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  copy_pretrained_final_fc1: true
  gradient_checkpointing: true

  finetune_mode: full
  qwen_fusion: self_attention_kv
  pretrained_copy_mode: compatible

  # Convert current observations to native RDT state slots and keep that
  # pretrained state encoder frozen. Delta actions use a separate trainable
  # 7-D adaptor/output head and remain in cache coordinates.
  rdt_state_dim: 128
  state_encoder_layout: rdt_eef
  freeze_state_adaptor: true
  freeze_condition_adaptors: false

# Retained so the same config schema can still construct legacy LoRA runs;
# ignored when model.finetune_mode is full.
lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_self_attention: true
  target_cross_attention: true
  target_ffn: true
  train_final_layer: true

noise_scheduler:
  num_train_timesteps: 1000
  num_inference_timesteps: 5
  beta_schedule: squaredcos_cap_v2
  prediction_type: sample
  clip_sample: false

data:
  train_manifest: cache_features/part_3/train/manifest.jsonl
  val_manifest: cache_features/part_3/validation/manifest.jsonl
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  episode_aware_shuffle: true
  shuffle_validation: false
  stratified_validation: true
  # Existing Part 3 Bridge packs contain merged trajectories. Remove this line
  # only after regenerating Bridge with the fixed precompute code.
  excluded_dataset_ids: [bridge]

training:
  max_steps: 20000  # tune for the desired training budget
  micro_batch_size: 1
  gradient_accumulation_steps: 256  # fallback when global_batch_size is null
  global_batch_size: 256
  learning_rate: 1.0e-4
  learning_rate_lora: 1.0e-4
  learning_rate_interfaces: 1.0e-4
  weight_decay_interfaces: 0.01
  warmup_steps: 500
  max_grad_norm: 1.0
  log_every: 10
  validate_every: 100
  save_every: 1000
  validation_batches: 256  # legacy fallback when validation_samples is null
  validation_samples: 256  # exact global subset, independent of GPU count
  sample_validation_batches: 0
  validation_seed: 12345
  mixed_precision: bf16
  report_to: wandb
  wandb_project: thinkflow-rdt
  wandb_run_name: part3-rdt1b-kv
