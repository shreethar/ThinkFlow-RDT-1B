seed: 42
rdt_repo: /home/ubuntu/RoboticsDiffusionTransformer
pretrained_model: robotics-diffusion-transformer/rdt-1b
output_dir: output_2

model:
  # Native pretrained RDT state/action space. The cache remains 7-D; the
  # collator converts XYZ + Euler RPY + gripper to native slots 30:33,
  # 33:39, and 10 respectively. Loss is masked to exactly those ten slots.
  action_dim: 128
  state_dim: 128
  cache_action_dim: 7
  cache_state_dim: 7
  pred_horizon: 64
  qwen_hidden_size: 2560
  qwen_kv_dim: 2048
  lang_token_dim: 4096
  img_token_dim: 1152
  max_lang_tokens: 128
  image_tokens: 4374  # 2 history frames x 3 cameras x 729 SigLIP patches
  hidden_size: 2048
  depth: 28
  num_heads: 32
  dtype: bfloat16
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  copy_pretrained_final_fc1: true
  # The 8 x 4 benchmark was ~13% faster without checkpointing and peaked at
  # only ~21 GiB on the 48 GiB RTX 6000 Ada.
  gradient_checkpointing: false

  finetune_mode: full
  qwen_fusion: fastthinkact_state_kv
  pretrained_copy_mode: compatible

  # Qwen [K;V] is projected once by the two-layer adaptor and appended directly
  # to every RDT self-attention block's native K/V tensor. Because RDT places
  # state and noisy-action tokens in that stream, action queries attend jointly
  # to state-derived K/V and the external visual-planning K/V.
  rdt_state_dim: 128
  state_encoder_layout: rdt_native_128
  action_encoder_layout: rdt_native_128
  freeze_state_adaptor: true
  freeze_condition_adaptors: true
  convert_cached_gripper_closed_to_open: false

# Retained so the same config schema can still construct legacy LoRA runs;
# ignored when model.finetune_mode is full.
lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_self_attention: true
  target_cross_attention: true
  target_ffn: true
  train_final_layer: true

noise_scheduler:
  num_train_timesteps: 1000
  num_inference_timesteps: 5
  beta_schedule: squaredcos_cap_v2
  prediction_type: sample
  clip_sample: false

data:
  # The launcher overrides these with merged manifests from each --cache-root.
  # Part 1 is the executable default while Part 2 is still downloading.
  train_manifest: cache_features/part_1_32frame_per_sample_qwen/train/manifest.jsonl
  val_manifest: cache_features/part_1_32frame_per_sample_qwen/validation/manifest.jsonl
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  episode_aware_shuffle: true
  shuffle_validation: false
  stratified_validation: true
  excluded_dataset_ids: []
  # Cached actions were normalized in 7-D. RPY must be denormalized back to
  # radians before its orthogonal-6D conversion. These audits contain the q01
  # and q99 values used by feature extraction.
  action_stats_paths:
    bc_z: dataset/mock_dataset/bc_z_dataset/audit.json
    bridge: dataset/mock_dataset/bridge_dataset/audit.json
    droid: dataset/mock_dataset/droid_dataset/audit.json
    fractal: dataset/mock_dataset/fractal_dataset/audit.json
    kuka: dataset/mock_dataset/kuka_dataset/audit.json

training:
  max_steps: 20000  # tune for the desired training budget
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  global_batch_size: 32
  learning_rate: 1.0e-4
  learning_rate_lora: 1.0e-4
  learning_rate_interfaces: 1.0e-4
  weight_decay_interfaces: 0.01
  warmup_steps: 500
  max_grad_norm: 1.0
  log_every: 10
  validate_every: 500
  save_every: 1000
  validation_batches: 256  # legacy fallback when validation_samples is null
  validation_samples: 256  # exact global subset, independent of GPU count
  validation_batch_size: 32
  sample_validation_batches: 1
  validation_seed: 12345
  mixed_precision: bf16
  report_to: wandb
  wandb_project: "ThinkLite B0 OXE"
  skip_nonfinite_updates: true
  max_consecutive_nonfinite_updates: 10
  log_gradient_stats: true
  qualitative_validation_examples: 32
  wandb_run_name: oxe-rdt1b-native128-fastthinkact-full
