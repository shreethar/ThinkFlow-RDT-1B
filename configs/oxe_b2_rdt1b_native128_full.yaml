seed: 42
rdt_repo: /home/ubuntu/RoboticsDiffusionTransformer
pretrained_model: robotics-diffusion-transformer/rdt-1b
output_dir: output_2/b2_oxe_native128_full_state_qwen_crosskv

model:
  # B2 and B0 share the same RDT architecture. B2 is selected by the cache:
  # every sample contains five spatial Qwen KV tokens [5, 2048] rather than
  # B0's single token [1, 2048].
  action_dim: 128
  state_dim: 128
  cache_action_dim: 7
  cache_state_dim: 7
  pred_horizon: 64
  qwen_hidden_size: 2560
  qwen_kv_dim: 2048
  lang_token_dim: 4096
  img_token_dim: 1152
  max_lang_tokens: 128
  image_tokens: 4374
  hidden_size: 2048
  depth: 28
  num_heads: 32
  dtype: bfloat16
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  copy_pretrained_final_fc1: true
  gradient_checkpointing: false
  finetune_mode: full
  qwen_fusion: fastthinkact_cross_attention_kv
  pretrained_copy_mode: compatible
  rdt_state_dim: 128
  state_encoder_layout: rdt_native_128
  action_encoder_layout: rdt_native_128
  freeze_state_adaptor: true
  freeze_condition_adaptors: true
  convert_cached_gripper_closed_to_open: false

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_self_attention: true
  target_cross_attention: true
  target_ffn: true
  train_final_layer: true

noise_scheduler:
  num_train_timesteps: 1000
  num_inference_timesteps: 5
  beta_schedule: squaredcos_cap_v2
  prediction_type: sample
  clip_sample: false

data:
  train_manifest: cache_features/train/manifest.jsonl
  val_manifest: cache_features/validation/manifest.jsonl
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  episode_aware_shuffle: true
  shuffle_validation: false
  stratified_validation: true
  excluded_dataset_ids: []
  # The downloaded cache stores normalized 7D actions. These are the audit
  # statistics used by the Part-1 extraction configuration to reconstruct RPY
  # in radians before converting it to the native orthogonal-6D slots.
  action_stats_paths:
    bc_z: dataset/mock_dataset/bc_z_dataset/audit.json
    bridge: dataset/mock_dataset/bridge_dataset/audit.json
    droid: dataset/mock_dataset/droid_dataset/audit.json
    fractal: dataset/mock_dataset/fractal_dataset/audit.json
    kuka: dataset/mock_dataset/kuka_dataset/audit.json

training:
  max_steps: 20000
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  global_batch_size: 32
  learning_rate: 1.0e-4
  learning_rate_lora: 1.0e-4
  learning_rate_interfaces: 1.0e-4
  weight_decay_interfaces: 0.01
  warmup_steps: 500
  max_grad_norm: 1.0
  log_every: 10
  validate_every: 500
  save_every: 1000
  validation_batches: 256
  validation_samples: 256
  validation_batch_size: 32
  sample_validation_batches: 1
  validation_seed: 12345
  sampled_validation_horizons: [10]
  mixed_precision: bf16
  report_to: wandb
  wandb_project: "ThinkLite B2 OXE"
  wandb_run_name: oxe-b2-state-qwen-crosskv-rdt1b-full-20k
  skip_nonfinite_updates: true
  max_consecutive_nonfinite_updates: 10
  log_gradient_stats: true
  qualitative_validation_examples: 32
  # Experimental matched-vs-shuffled counterfactual objective. Fast-ThinkAct's
  # published action stage uses imitation loss alone; this explicitly prevents
  # RDT from treating the B2 KV as only a sample-independent bias.
  qwen_fusion_loss_weight: 0.5
  qwen_fusion_loss_margin: 0.002
