seed: 42
rdt_repo: /home/ubuntu/RoboticsDiffusionTransformer
pretrained_model: robotics-diffusion-transformer/rdt-1b
output_dir: output_2/libero_b0_hidden_native128_full

model:
  # B0 uses one literal </think> final-layer hidden state. The matching
  # layer-7 KV remains cached for diagnostics but is not consumed by training.
  action_dim: 128
  state_dim: 128
  cache_action_dim: 7
  cache_state_dim: 9
  pred_horizon: 64
  qwen_hidden_size: 2560
  qwen_kv_dim: 2048
  spatial_token_count: 1
  waypoint_dim: 2
  waypoint_embed_dim: 64
  lang_token_dim: 4096
  img_token_dim: 1152
  max_lang_tokens: 128
  image_tokens: 4374
  hidden_size: 2048
  depth: 28
  num_heads: 32
  dtype: bfloat16
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  copy_pretrained_final_fc1: true
  gradient_checkpointing: false
  finetune_mode: full
  qwen_fusion: hidden_cross_attention
  conditioning_variant: b0
  pretrained_copy_mode: compatible
  rdt_state_dim: 128
  state_encoder_layout: rdt_native_128
  action_encoder_layout: rdt_native_128
  native_rdt_128_mapping: libero_joint_eef_delta
  freeze_state_adaptor: true
  freeze_condition_adaptors: true
  convert_cached_gripper_closed_to_open: false

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_self_attention: true
  target_cross_attention: true
  target_ffn: true
  train_final_layer: true

noise_scheduler:
  num_train_timesteps: 1000
  num_inference_timesteps: 5
  beta_schedule: squaredcos_cap_v2
  prediction_type: sample
  clip_sample: false

data:
  train_manifest: cache_features_libero_b0_hidden_native/libero_spatial/train/manifest.jsonl
  val_manifest: cache_features_libero_b0_hidden_native/libero_spatial/validation/manifest.jsonl
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  episode_aware_shuffle: true
  shuffle_validation: false
  stratified_validation: true
  excluded_dataset_ids: []

training:
  max_steps: 20000
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  global_batch_size: 32
  learning_rate: 1.0e-4
  learning_rate_lora: 1.0e-4
  learning_rate_interfaces: 1.0e-4
  weight_decay_interfaces: 0.01
  warmup_steps: 500
  max_grad_norm: 1.0
  log_every: 10
  validate_every: 500
  save_every: 1000
  validation_batch_size: 32
  validation_batches: 8
  validation_samples: 256
  sample_validation_batches: 1
  validation_seed: 12345
  sampled_validation_horizons: [10]
  mixed_precision: bf16
  report_to: wandb
  wandb_project: "ThinkLite B0 LIBERO"
  wandb_run_name: libero-b0-hidden-native128-full
  skip_nonfinite_updates: true
  max_consecutive_nonfinite_updates: 10
  log_gradient_stats: true
  qualitative_validation_examples: 32
  qwen_fusion_loss_weight: 0.5
  qwen_fusion_loss_margin: 0.002
