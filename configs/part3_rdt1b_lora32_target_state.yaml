seed: 42
rdt_repo: /home/ubuntu/RoboticsDiffusionTransformer
pretrained_model: robotics-diffusion-transformer/rdt-1b
output_dir: outputs/part3_rdt1b_lora32_target_state

model:
  action_dim: 7
  state_dim: 7
  pred_horizon: 64
  qwen_hidden_size: 2560
  qwen_kv_dim: 2048
  lang_token_dim: 4096
  img_token_dim: 1152
  max_lang_tokens: 128
  image_tokens: 4374
  hidden_size: 2048
  depth: 28
  num_heads: 32
  dtype: bfloat16
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  copy_pretrained_final_fc1: true
  gradient_checkpointing: true

  finetune_mode: lora
  qwen_fusion: self_attention_kv
  pretrained_copy_mode: compatible
  rdt_state_dim: 128
  state_encoder_layout: rdt_eef
  action_encoder_layout: rdt_eef
  freeze_state_adaptor: true
  freeze_condition_adaptors: false

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_self_attention: true
  target_cross_attention: true
  target_ffn: false
  train_final_layer: true

noise_scheduler:
  num_train_timesteps: 1000
  num_inference_timesteps: 5
  beta_schedule: squaredcos_cap_v2
  prediction_type: sample
  clip_sample: false

data:
  train_manifest: cache_features/part_3_target_state/train/manifest.jsonl
  val_manifest: cache_features/part_3_target_state/validation/manifest.jsonl
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  episode_aware_shuffle: true
  shuffle_validation: false
  stratified_validation: true
  excluded_dataset_ids: [bridge]

training:
  max_steps: 20000
  micro_batch_size: 128
  gradient_accumulation_steps: 2
  global_batch_size: 256
  learning_rate: 1.0e-4
  learning_rate_lora: 1.0e-4
  learning_rate_interfaces: 1.0e-4
  weight_decay_interfaces: 0.01
  warmup_steps: 10
  max_grad_norm: 1.0
  log_every: 1
  validate_every: 100
  save_every: 1000
  validation_batches: 256
  validation_samples: 256
  sample_validation_batches: 0
  validation_seed: 12345
  mixed_precision: bf16
  report_to: wandb
  wandb_project: thinkflow-rdt
  wandb_run_name: part3-rdt1b-lora32-target-state
