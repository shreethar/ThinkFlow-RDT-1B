[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkflow-rdt"
version = "0.1.0"
description = "SFT-conditioned RDT-1B diffusion action model with LoRA"
requires-python = ">=3.12"
dependencies = [
  "flash-linear-attention[cuda]",
  # The direct wheel URLs below select the CUDA 12 / Torch 2.10 builds. Their
  # embedded package metadata exposes the base versions without local tags.
  "flash-attn==2.8.3",
  "causal-conv1d==1.6.2.post1",
  "torch==2.10.0",
  "torchvision==0.25.0",
  # Transformers 5.x treats older Accelerate releases as unavailable for
  # device_map, even if the package can be imported.
  "accelerate>=1.1.0",
  "diffusers>=0.27",
  "huggingface-hub>=0.23",
  "numpy>=1.24,<2.0.0",
  "scipy<1.14",
  "peft>=0.11",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "tensorboard>=2.15",
  "timm>=0.9",
  "tqdm>=4.66",
  "transformers>=4.44",
  "matplotlib>=3.7.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "opencv-python-headless>=4.9",
  "h5py>=3.10",
  "robosuite>=1.4,<1.5",
  "wandb>=0.17",
  "protobuf>=5.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
index = [
  { name = "pytorch", url = "https://download.pytorch.org/whl/cu128", explicit = true }
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
flash-attn = { url = "https://github.com/lesj0610/flash-attention/releases/download/v2.8.3-cu12-torch2.10-cp312/flash_attn-2.8.3%2Bcu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.2.post1/causal_conv1d-1.6.2.post1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
